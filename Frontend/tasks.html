<script src="js/tasks.js"></script>


<script>

    const logoutBtn =
        document.getElementById("logoutBtn");


    logoutBtn.addEventListener(
        "click",
        () => {

            if (
                confirm(
                    "Voulez-vous vraiment vous déconnecter ?"
                )
            ) {

                localStorage.removeItem(
                    "isLoggedIn"
                );

                window.location.href =
                    "login.html";

            }

        }
    );

</script>
<!-- MODALE NOUVELLE TÂCHE -->
<div
    id="taskModal"
    class="hidden fixed inset-0 z-[100] bg-black/50 items-center justify-center p-4"
>
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl">

        <div class="flex items-center justify-between p-6 border-b">

            <div>
                <h2 class="text-xl font-bold">
                    Nouvelle tâche
                </h2>

                <p class="text-sm text-slate-500">
                    Créer une nouvelle tâche
                </p>
            </div>

            <button
                id="closeTaskModal"
                class="text-2xl text-slate-400 hover:text-slate-800"
            >
                ×
            </button>

        </div>


        <form id="taskForm" class="p-6 space-y-5">

            <div>

                <label class="block text-sm font-semibold mb-2">
                    Titre
                </label>

                <input
                    id="taskTitle"
                    type="text"
                    required
                    placeholder="Ex : Créer la page d'accueil"
                    class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"
                >

            </div>


            <div>

                <label class="block text-sm font-semibold mb-2">
                    Description
                </label>

                <textarea
                    id="taskDescription"
                    rows="3"
                    placeholder="Description de la tâche..."
                    class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"
                ></textarea>

            </div>


            <div class="grid grid-cols-2 gap-4">

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Statut
                    </label>

                    <select
                        id="taskStatus"
                        class="w-full border rounded-xl px-4 py-3"
                    >

                        <option value="todo">
                            À faire
                        </option>

                        <option value="in-progress">
                            En cours
                        </option>

                        <option value="paused">
                            En pause
                        </option>

                        <option value="completed">
                            Terminée
                        </option>

                    </select>

                </div>


                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Priorité
                    </label>

                    <select
                        id="taskPriority"
                        class="w-full border rounded-xl px-4 py-3"
                    >

                        <option value="low">
                            Low
                        </option>

                        <option value="medium">
                            Medium
                        </option>

                        <option value="high">
                            High
                        </option>

                        <option value="urgent">
                            Urgent
                        </option>

                    </select>

                </div>

            </div>


            <div class="grid grid-cols-2 gap-4">

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Deadline
                    </label>

                    <input
                        id="taskDeadline"
                        type="date"
                        class="w-full border rounded-xl px-4 py-3"
                    >

                </div>


                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Tags
                    </label>

                    <input
                        id="taskTags"
                        type="text"
                        placeholder="design, frontend..."
                        class="w-full border rounded-xl px-4 py-3"
                    >

                </div>

            </div>


            <div class="flex justify-end gap-3 pt-3">

                <button
                    type="button"
                    id="cancelTaskBtn"
                    class="px-5 py-3 rounded-xl border"
                >
                    Annuler
                </button>

                <button
                    type="submit"
                    class="px-5 py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700"
                >
                    Créer la tâche
                </button>

            </div>

        </form>

    </div>
</div>


<script>

const taskModal = document.getElementById("taskModal");

const addTaskBtn = document.getElementById("addTaskBtn");

const closeTaskModal =
    document.getElementById("closeTaskModal");

const cancelTaskBtn =
    document.getElementById("cancelTaskBtn");

const taskForm =
    document.getElementById("taskForm");


/* OUVRIR */

addTaskBtn.addEventListener("click", () => {

    taskModal.classList.remove("hidden");

    taskModal.classList.add("flex");

});


/* FERMER */

function closeTask() {

    taskModal.classList.add("hidden");

    taskModal.classList.remove("flex");

    taskForm.reset();

}


closeTaskModal.addEventListener(
    "click",
    closeTask
);

cancelTaskBtn.addEventListener(
    "click",
    closeTask
);


/* CLIQUER SUR LE FOND */

taskModal.addEventListener("click", (event) => {

    if (event.target === taskModal) {

        closeTask();

    }

});


/* CREATION */

taskForm.addEventListener("submit", (event) => {

    event.preventDefault();


    const task = {

        id:
            "task_" +
            Date.now(),

        title:
            document.getElementById("taskTitle").value,

        description:
            document.getElementById("taskDescription").value,

        status:
            document.getElementById("taskStatus").value,

        priority:
            document.getElementById("taskPriority").value,

        deadline:
            document.getElementById("taskDeadline").value,

        tags:
            document.getElementById("taskTags").value
                .split(",")
                .map(tag => tag.trim())
                .filter(Boolean),

        createdAt:
            new Date().toISOString()

    };


    const tasks =
        JSON.parse(
            localStorage.getItem("tasks")
        ) || [];


    tasks.unshift(task);


    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );


    alert("Tâche créée avec succès !");


    closeTask();


    if (typeof renderTasks === "function") {

        renderTasks();

    }

});

</script>
