    <!-- HEADER -->

    >

        <div>

            <h2 class="text-xl font-bold">

                Organisez et suivez vos projets.
            </p>

        </div>


        <div class="flex items-center gap-3">

                    Administrateur
                </p>

    <!-- MAIN -->

    <main class="p-8">

            <button

<script src="js/projects.js"></script>


<script>

    document
        .getElementById("logoutBtn")
        .addEventListener(
            "click",
            () => {

                if (
                    confirm(
                        "Voulez-vous vraiment vous déconnecter ?"
                    )
                ) {

                    localStorage.removeItem(
                        "isLoggedIn"
                    );

                    window.location.href =
                        "login.html";

                }

            }
        );

</script>

<!-- MODALE NOUVEAU PROJET -->

<div
    id="projectModal"
    class="hidden fixed inset-0 z-[100] bg-black/50 items-center justify-center p-4"
>

    <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl">

        <div class="flex justify-between items-center p-6 border-b">

            <div>

                <h2 class="text-xl font-bold">
                    Nouveau projet
                </h2>

                <p class="text-sm text-slate-500">
                    Créer un nouveau projet
                </p>

            </div>

            <button
                id="closeProjectModal"
                class="text-2xl text-slate-400"
            >
                ×
            </button>

        </div>


        <form
            id="projectForm"
            class="p-6 space-y-5"
        >

            <div>

                <label class="block font-semibold text-sm mb-2">
                    Nom du projet
                </label>

                <input
                    id="projectName"
                    type="text"
                    required
                    placeholder="Ex : Site e-commerce"
                    class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"
                >

            </div>


            <div>

                <label class="block font-semibold text-sm mb-2">
                    Description
                </label>

                <textarea
                    id="projectDescription"
                    rows="4"
                    placeholder="Description du projet..."
                    class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"
                ></textarea>

            </div>


            <div class="grid grid-cols-2 gap-4">

                <div>

                    <label class="block font-semibold text-sm mb-2">
                        Statut
                    </label>

                    <select
                        id="projectStatus"
                        class="w-full border rounded-xl px-4 py-3"
                    >

                        <option value="active">
                            Actif
                        </option>

                        <option value="completed">
                            Terminé
                        </option>

                        <option value="paused">
                            En pause
                        </option>

                    </select>

                </div>


                <div>

                    <label class="block font-semibold text-sm mb-2">
                        Deadline
                    </label>

                    <input
                        id="projectDeadline"
                        type="date"
                        class="w-full border rounded-xl px-4 py-3"
                    >

                </div>

            </div>


            <div class="flex justify-end gap-3">

                <button
                    type="button"
                    id="cancelProjectBtn"
                    class="px-5 py-3 rounded-xl border"
                >
                    Annuler
                </button>

                <button
                    type="submit"
                    class="px-5 py-3 rounded-xl bg-indigo-600 text-white font-semibold"
                >
                    Créer le projet
                </button>

            </div>

        </form>

    </div>

</div>


<script>

const projectModal =
    document.getElementById("projectModal");

const addProjectBtn =
    document.getElementById("addProjectBtn");

const closeProjectModal =
    document.getElementById("closeProjectModal");

const cancelProjectBtn =
    document.getElementById("cancelProjectBtn");

const projectForm =
    document.getElementById("projectForm");


addProjectBtn.addEventListener("click", () => {

    projectModal.classList.remove("hidden");

    projectModal.classList.add("flex");

});


function closeProject() {

    projectModal.classList.add("hidden");

    projectModal.classList.remove("flex");

    projectForm.reset();

}


closeProjectModal.addEventListener(
    "click",
    closeProject
);


cancelProjectBtn.addEventListener(
    "click",
    closeProject
);


projectModal.addEventListener("click", (event) => {

    if (event.target === projectModal) {

        closeProject();

    }

});


projectForm.addEventListener("submit", (event) => {

    event.preventDefault();


    const project = {

        id:
            "project_" +
            Date.now(),

        name:
            document.getElementById(
                "projectName"
            ).value,

        description:
            document.getElementById(
                "projectDescription"
            ).value,

        status:
            document.getElementById(
                "projectStatus"
            ).value,

        deadline:
            document.getElementById(
                "projectDeadline"
            ).value,

        createdAt:
            new Date().toISOString()

    };


    const projects =
        JSON.parse(
            localStorage.getItem("projects")
        ) || [];


    projects.unshift(project);


    localStorage.setItem(
        "projects",
        JSON.stringify(projects)
    );


    alert("Projet créé avec succès !");


    closeProject();


    if (typeof renderProjects === "function") {

        renderProjects();

    }

});

</script>
</body>
