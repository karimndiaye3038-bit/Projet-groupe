<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kanban - TaskFlow Pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-slate-50 min-h-screen">


  <!-- ======================================================
       SIDEBAR
  ======================================================= -->

  <aside
    class="
      fixed
      top-0
      left-0
      z-50
      w-64
      h-screen
      bg-slate-900
      text-white
      flex
      flex-col
    "
  >

    <!-- LOGO -->

    <div
      class="
        h-20
        px-6
        flex
        items-center
        border-b
        border-slate-800
      "
    >

      <div class="flex items-center gap-3">

        <div
          class="
            w-10
            h-10
            rounded-xl
            bg-indigo-600
            flex
            items-center
            justify-center
            font-bold
          "
        >
          TF
        </div>

        <div>

          <h1 class="font-bold text-lg">
            TaskFlow Pro
          </h1>

          <p class="text-xs text-slate-400">
            Gestion de projets
          </p>

        </div>

      </div>

    </div>


    <!-- MENU -->

    <nav class="flex-1 px-4 py-6">

      <p
        class="
          px-3
          mb-3
          text-xs
          uppercase
          tracking-wider
          text-slate-500
        "
      >
        Menu principal
      </p>


      <!-- DASHBOARD -->

      <a
        href="index.html"
        class="
          flex
          items-center
          gap-3
          px-4
          py-3
          mb-2
          rounded-xl
          text-slate-300
          hover:bg-slate-800
          hover:text-white
          transition
        "
      >
        <span class="w-6 text-center">▣</span>

        <span>Dashboard</span>
      </a>


      <!-- TACHES -->

      <a
        href="tasks.html"
        class="
          flex
          items-center
          gap-3
          px-4
          py-3
          mb-2
          rounded-xl
          text-slate-300
          hover:bg-slate-800
          hover:text-white
          transition
        "
      >
        <span class="w-6 text-center">✓</span>

        <span>Tâches</span>
      </a>


      <!-- PROJETS -->

      <a
        href="projects.html"
        class="
          flex
          items-center
          gap-3
          px-4
          py-3
          mb-2
          rounded-xl
          text-slate-300
          hover:bg-slate-800
          hover:text-white
          transition
        "
      >
        <span class="w-6 text-center">□</span>

        <span>Projets</span>
      </a>


      <!-- MEMBRES -->

      <a
        href="members.html"
        class="
          flex
          items-center
          gap-3
          px-4
          py-3
          mb-2
          rounded-xl
          text-slate-300
          hover:bg-slate-800
          hover:text-white
          transition
        "
      >
        <span class="w-6 text-center">◎</span>

        <span>Membres</span>
      </a>


      <!-- KANBAN ACTIF -->

      <a
        href="kanban.html"
        class="
          flex
          items-center
          gap-3
          px-4
          py-3
          mb-2
          rounded-xl
          bg-indigo-600
          text-white
        "
      >
        <span class="w-6 text-center">▤</span>

        <span>Kanban</span>
      </a>


      <!-- SEPARATION -->

      <div class="border-t border-slate-800 my-6"></div>


      <!-- PARAMETRES -->

      <a
        href="parametre.html"
        class="
          flex
          items-center
          gap-3
          px-4
          py-3
          rounded-xl
          text-slate-300
          hover:bg-slate-800
          hover:text-white
          transition
        "
      >
        <span class="w-6 text-center">⚙</span>

        <span>Paramètres</span>
      </a>

    </nav>


    <!-- UTILISATEUR -->

    <div class="p-4 border-t border-slate-800">

      <div
        class="
          flex
          items-center
          gap-3
          p-3
          rounded-xl
          bg-slate-800
        "
      >

        <div
          class="
            w-10
            h-10
            rounded-full
            bg-indigo-600
            flex
            items-center
            justify-center
            font-bold
          "
        >
          F
        </div>

        <div class="flex-1">

          <p class="text-sm font-semibold">
            Fatou
          </p>

          <p class="text-xs text-slate-400">
            Administrateur
          </p>

        </div>

        <button
          id="logoutBtn"
          type="button"
          class="
            text-slate-400
            hover:text-white
            text-xl
          "
          title="Déconnexion"
        >
          ⇥
        </button>

      </div>

    </div>

  </aside>



  <!-- ======================================================
       CONTENU PRINCIPAL
       ml-64 = espace réservé au sidebar
  ======================================================= -->

  <div class="ml-64 min-h-screen">


    <!-- ====================================================
         HEADER
    ===================================================== -->

    <header
      class="
        bg-white
        border-b
        sticky
        top-0
        z-40
      "
    >

      <div
        class="
          px-6
          py-5
          flex
          justify-between
          items-center
        "
      >

        <div>

          <h1
            class="
              text-2xl
              font-bold
              text-slate-800
            "
          >
            Tableau Kanban
          </h1>

          <p class="text-sm text-slate-500 mt-1">
            Gestion des tâches
          </p>

        </div>


        <button
          id="refreshBtn"
          type="button"
          class="
            bg-indigo-600
            hover:bg-indigo-700
            text-white
            px-4
            py-2
            rounded-lg
            transition
          "
        >
          ↻ Actualiser
        </button>

      </div>

    </header>



    <!-- ====================================================
         CONTENU
    ===================================================== -->

    <main class="px-6 py-8">


      <!-- MESSAGE -->

      <div
        id="kanbanMessage"
        class="hidden mb-6"
      ></div>



      <!-- ==================================================
           TABLEAU KANBAN
      ================================================== -->

      <div
        class="
          grid
          grid-cols-1
          md:grid-cols-2
          xl:grid-cols-4
          gap-5
          items-start
        "
      >


        <!-- =================================================
             À FAIRE
        ================================================= -->

        <section
          class="
            bg-slate-100
            rounded-2xl
            p-4
            min-h-[550px]
          "
        >

          <div
            class="
              flex
              justify-between
              items-center
              mb-5
            "
          >

            <div class="flex items-center gap-2">

              <div
                class="
                  w-3
                  h-3
                  rounded-full
                  bg-slate-500
                "
              ></div>

              <h2 class="font-bold text-slate-700">
                À FAIRE
              </h2>

            </div>


            <span
              id="count-todo"
              class="
                bg-white
                text-slate-600
                px-3
                py-1
                rounded-full
                text-sm
                font-semibold
              "
            >
              0
            </span>

          </div>


          <div
            id="todo"
            class="space-y-4"
          ></div>

        </section>



        <!-- =================================================
             EN COURS
        ================================================== -->

        <section
          class="
            bg-blue-50
            rounded-2xl
            p-4
            min-h-[550px]
          "
        >

          <div
            class="
              flex
              justify-between
              items-center
              mb-5
            "
          >

            <div class="flex items-center gap-2">

              <div
                class="
                  w-3
                  h-3
                  rounded-full
                  bg-blue-500
                "
              ></div>

              <h2 class="font-bold text-blue-700">
                EN COURS
              </h2>

            </div>


            <span
              id="count-in_progress"
              class="
                bg-white
                text-blue-600
                px-3
                py-1
                rounded-full
                text-sm
                font-semibold
              "
            >
              0
            </span>

          </div>


          <div
            id="in_progress"
            class="space-y-4"
          ></div>

        </section>



        <!-- =================================================
             EN PAUSE
        ================================================== -->

        <section
          class="
            bg-yellow-50
            rounded-2xl
            p-4
            min-h-[550px]
          "
        >

          <div
            class="
              flex
              justify-between
              items-center
              mb-5
            "
          >

            <div class="flex items-center gap-2">

              <div
                class="
                  w-3
                  h-3
                  rounded-full
                  bg-yellow-500
                "
              ></div>

              <h2 class="font-bold text-yellow-700">
                EN PAUSE
              </h2>

            </div>


            <span
              id="count-paused"
              class="
                bg-white
                text-yellow-600
                px-3
                py-1
                rounded-full
                text-sm
                font-semibold
              "
            >
              0
            </span>

          </div>


          <div
            id="paused"
            class="space-y-4"
          ></div>

        </section>



        <!-- =================================================
             TERMINÉ
        ================================================== -->

        <section
          class="
            bg-green-50
            rounded-2xl
            p-4
            min-h-[550px]
          "
        >

          <div
            class="
              flex
              justify-between
              items-center
              mb-5
            "
          >

            <div class="flex items-center gap-2">

              <div
                class="
                  w-3
                  h-3
                  rounded-full
                  bg-green-500
                "
              ></div>

              <h2 class="font-bold text-green-700">
                TERMINÉ
              </h2>

            </div>


            <span
              id="count-completed"
              class="
                bg-white
                text-green-600
                px-3
                py-1
                rounded-full
                text-sm
                font-semibold
              "
            >
              0
            </span>

          </div>


          <div
            id="completed"
            class="space-y-4"
          ></div>

        </section>


      </div>

    </main>

  </div>



  <!-- ======================================================
       JAVASCRIPT
  ======================================================= -->

  <script src="./js/kanban.js"></script>

</body>

</html>
